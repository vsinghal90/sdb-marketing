.bars{position:absolute;top:2.4cqw;left:3cqw;right:3cqw;display:flex;gap:1cqw;z-index:6}
.bar{flex:var(--d) 1 0;height:.7cqw;border-radius:1cqw;background:rgba(255,255,255,.45);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--red)}
.brandmark{position:absolute;top:5cqw;left:3.4cqw;z-index:6;display:flex;align-items:center;gap:2cqw;font-family:var(--f-title);font-weight:700;font-size:4.4cqw;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.brandmark img{width:10cqw;height:10cqw;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.brandmark.dark{color:var(--ink);text-shadow:none}

.scene{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
.scene.on{opacity:1;visibility:visible}
.fill{position:absolute;inset:0}
.ph{position:absolute;inset:0;background-size:cover;background-position:center}
.ph.fallback{background:radial-gradient(circle at 50% 45%,#f6cf7a 0 22%,#e3a640 23% 25%,rgba(255,255,255,.35) 26% 27%,transparent 28%),radial-gradient(circle at 15% 10%,rgba(255,255,255,.35),transparent 40%),linear-gradient(160deg,#fbbc05 0%,#f7931e 45%,#ea4335 100%)}
.on .kb{animation:kb 6s ease-out both}
@keyframes kb{from{transform:scale(1.18)}to{transform:scale(1.02)}}
.shade-b{position:absolute;inset:0;background:linear-gradient(to top,rgba(90,20,8,.8) 0%,rgba(90,20,8,.25) 40%,transparent 60%)}
.shade-all{position:absolute;inset:0;background:rgba(20,11,6,.3)}
.content{position:absolute;inset:0;padding:22cqw 7cqw 30cqw;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5cqw;text-align:center}
.content.bottom{justify-content:flex-end;padding-bottom:34cqw}

.ost{font-family:var(--f-title);font-weight:700;font-size:10cqw;line-height:1.08;color:#fff;text-wrap:balance;text-shadow:0 2px 12px rgba(0,0,0,.45)}
.ost.ink{color:var(--ink);text-shadow:none!important}
.y{color:var(--yellow)}.g{color:var(--green)}.r{color:var(--red)}
.sub{font-family:var(--f-sub);font-style:italic;font-weight:600;font-size:5.6cqw;color:#fff}
.label{font-family:var(--f-sub);font-weight:800;font-size:8cqw;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.5)}

.on .pop{animation:pop .6s cubic-bezier(.2,1.4,.4,1) both}
.on .rise{animation:rise .6s ease-out both}
.d1{animation-delay:.2s!important}.d2{animation-delay:.5s!important}.d3{animation-delay:.8s!important}.d4{animation-delay:1.1s!important}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes rise{from{transform:translateY(4cqw);opacity:0}to{transform:none;opacity:1}}

/* scene 1 ghee shimmer */
.ghee{position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,236,170,.35) 50%,transparent 60%);background-size:260% 100%;mix-blend-mode:screen}
.on .ghee{animation:brush 1.5s ease-in-out infinite}
@keyframes brush{from{background-position:120% 0}to{background-position:-20% 0}}

/* scene 2 */
.card{background:rgba(253,244,230,.95);border-radius:6cqw;padding:7cqw 6cqw;display:grid;gap:4cqw;justify-items:center;width:100%;box-shadow:0 3cqw 8cqw rgba(0,0,0,.35)}
.stars{display:flex;gap:2cqw}
.star{width:11cqw;height:11cqw;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);background:linear-gradient(90deg,var(--yellow) var(--f,0%),rgba(58,42,33,.18) var(--f,0%))}
.big{font-family:var(--f-title);font-weight:700;font-size:19cqw;line-height:1;color:var(--red);font-variant-numeric:tabular-nums}
.big small{display:block;font-size:.36em;color:var(--ink)}
.rated{font-family:var(--f-sub);font-style:italic;font-weight:600;font-size:5.4cqw;color:var(--ink-soft)}
.badges{display:flex;gap:2.4cqw;flex-wrap:wrap;justify-content:center}
.badge{display:flex;align-items:center;gap:1.6cqw;background:#fff;border:1px solid var(--line);border-radius:999px;padding:1.4cqw 3.2cqw 1.4cqw 1.6cqw;font-weight:700;font-size:3.8cqw;color:var(--ink);box-shadow:0 1cqw 2.4cqw rgba(58,42,33,.25)}
.badge img,.badge .dot{width:6.6cqw;height:6.6cqw;border-radius:50%;object-fit:cover}
.badge.ownly{padding:0;border:0;overflow:hidden;background:#ff4b82}
.badge.ownly img{width:auto;height:9.8cqw;border-radius:0;object-fit:contain}
.badge.logo{padding:1.6cqw 3.4cqw}
.badge.logo img{width:auto;height:6.6cqw;border-radius:0;object-fit:contain}
.lockup{width:90cqw;background:#fff;border-radius:5cqw;padding:3cqw 4cqw;box-shadow:0 3cqw 7cqw rgba(58,42,33,.3)}
.lockup img{display:block;width:100%;height:auto}
.badge .dot{display:grid;place-items:center;color:#fff;font-size:3.6cqw;font-family:var(--f-title)}
.dot.z{background:#e23744}.dot.o{background:var(--green)}

/* scene 3 montage */
.slide{position:absolute;inset:0;opacity:0}
.slide.cur{opacity:1}
.slide.cur .ph{animation:kb 1.6s ease-out both}
.tagline{position:absolute;left:7cqw;bottom:44cqw;display:flex;align-items:center;gap:2cqw}
.pill{background:var(--red);color:#fff;font-weight:700;font-size:4cqw;padding:1.2cqw 3.2cqw;border-radius:999px}
.top-ost{position:absolute;top:20cqw;left:6cqw;right:6cqw;text-align:center}
.sides{position:absolute;left:0;right:0;bottom:35cqw;display:flex;gap:2cqw;justify-content:center}
.side{font-size:3.6cqw;padding:1.2cqw 3cqw;border-radius:999px;color:#fff;font-weight:700}

/* scene 4 hero */
.frame{width:78cqw;aspect-ratio:1;border-radius:50%;overflow:hidden;position:relative;border:2cqw solid #fff;box-shadow:0 3cqw 10cqw rgba(0,0,0,.35)}
.on .frame .ph{animation:zoomin 4s ease-out both}
@keyframes zoomin{from{transform:scale(1)}to{transform:scale(1.35)}}
.rank{position:absolute;top:16cqw;right:7cqw;width:22cqw;height:22cqw;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-family:var(--f-title);font-weight:700;font-size:9cqw;box-shadow:0 0 0 1.6cqw #fff;z-index:2}
.plates{font-family:var(--f-sub);font-weight:800;font-size:7cqw;color:var(--ink)}
.plates b{color:var(--red);font-variant-numeric:tabular-nums}

/* scene 6 stats */
.stats{display:grid;gap:3cqw;width:100%}
.stat{background:rgba(253,244,230,.96);border-radius:4cqw;padding:3.4cqw 4.4cqw;display:flex;align-items:baseline;justify-content:space-between;gap:2cqw}
.stat b{font-family:var(--f-title);font-size:11cqw;line-height:1;color:var(--c);font-variant-numeric:tabular-nums}

const TOTAL=30,starts=[];let acc=0;S.forEach(s=>{starts.push(acc);acc+=s.d});
const $=id=>document.getElementById(id);
document.querySelectorAll('.ph').forEach(p=>{const u=IMG[p.dataset.img];if(u)p.style.backgroundImage=`url(${u})`;else p.classList.add('fallback')});
const scenes=[...document.querySelectorAll('.scene')];
$('bars').innerHTML=S.map(s=>`<div class="bar" style="--d:${s.d}"><i></i></div>`).join('');
const fills=[...document.querySelectorAll('.bar i')];
const fmt=n=>Math.round(n).toLocaleString('en-IN');
const ease=x=>1-Math.pow(1-Math.min(Math.max(x,0),1),3);
let t=0,playing=false,last=null,cur=-1;

function setScene(i){
  if(i===cur)return;cur=i;
  scenes.forEach((el,k)=>el.classList.remove('on'));void scenes[i].offsetWidth;scenes[i].classList.add('on');
  $('vo').textContent=S[i].vo;
}
function slides(i,local,per,lead){const sl=[...scenes[i].querySelectorAll('.slide')];const k=Math.min(sl.length-1,Math.floor(Math.max(local-lead,0)/per));sl.forEach((x,j)=>x.classList.toggle('cur',j===k))}
function render(){
  let i=S.length-1;for(let k=0;k<S.length;k++){if(t<starts[k]+S[k].d){i=k;break}}
  setScene(i);const l=t-starts[i];
  fills.forEach((b,k)=>b.style.width=(k<i?100:k>i?0:Math.min(100,l/S[k].d*100))+'%');
  if(i===1){scenes[1].querySelectorAll('.star').forEach((s,k)=>s.style.setProperty('--f',ease((l-.4-k*.2)/.45)*100+'%'));$('c-ratings').textContent=fmt(5000*ease((l-.5)/2))}
  if(i===2)slides(2,l,1.5,0);
  if(i===3)$('c-plates').textContent=fmt(4500*ease((l-.6)/1.8));
  if(i===4)slides(4,l,4/3,0);
  if(i===5){$('c-orders').textContent=fmt(19000*ease((l-.2)/1.8));$('c-cust').textContent=fmt(10000*ease((l-.5)/1.8))}
}
function tick(ts){
  if(playing){if(last!=null)t=Math.min(TOTAL-0.001,t+(ts-last)/1000);last=ts;if(t>=TOTAL-0.001)playing=false}else last=null;
  render();requestAnimationFrame(tick);
}
function restart(){t=0;cur=-1;playing=true;last=null;$('start').hidden=true}
$('start').onclick=restart;
addEventListener('keydown',e=>{
  if(e.key===' '){e.preventDefault();if($('start').hidden)playing=!playing;else restart()}
  else if(e.key==='r'||e.key==='R')restart();
  else if(e.key==='v'||e.key==='V')$('vo').hidden=!$('vo').hidden;
  else if(e.key==='f'||e.key==='F'){(document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.())?.catch?.(()=>{})}
});
render();requestAnimationFrame(tick);
</script>
