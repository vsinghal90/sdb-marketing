<!-- "Khana khaya?" background: a bright Bengaluru PG room at 9:47 PM. Rani-pink wall with a block-print motif, marigold curtains,
     teal window frame, rainy city with an elevated metro train outside, fairy lights, money plant, teal desk. Only this meme uses it. -->
<svg class="room" viewBox="0 0 1080 1920" preserveAspectRatio="xMidYMid slice" aria-hidden="true" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="kkWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d81b6a"/><stop offset=".55" stop-color="#b3155a"/><stop offset="1" stop-color="#7c0d45"/></linearGradient>
    <pattern id="kkPrint" width="90" height="90" patternUnits="userSpaceOnUse"><g fill="#ffd1e3" opacity=".16"><path d="M45 18 l9 14 l-9 14 l-9 -14z"/><circle cx="45" cy="32" r="3"/><circle cx="0" cy="77" r="5"/><circle cx="90" cy="77" r="5"/><path d="M0 70 l6 7 l-6 7 M90 70 l-6 7 l6 7" stroke="#ffd1e3" stroke-width="2" fill="none"/></g></pattern>
    <linearGradient id="kkNight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#151a4a"/><stop offset="1" stop-color="#3b2f7a"/></linearGradient>
    <linearGradient id="kkCurt" x1="0" x2="1"><stop offset="0" stop-color="#ffb300"/><stop offset=".25" stop-color="#ffd54a"/><stop offset=".5" stop-color="#f29d00"/><stop offset=".75" stop-color="#ffcf3a"/><stop offset="1" stop-color="#e88f00"/></linearGradient>
    <radialGradient id="kkLamp" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff0b0" stop-opacity=".75"/><stop offset="1" stop-color="#ffc94a" stop-opacity="0"/></radialGradient>
    <linearGradient id="kkDesk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14c2b0"/><stop offset="1" stop-color="#0b8f82"/></linearGradient>
    <linearGradient id="kkFloor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b1a6e"/><stop offset="1" stop-color="#2a0b36"/></linearGradient>
    <clipPath id="kkWin"><rect x="190" y="290" width="700" height="460"/></clipPath>
  </defs>
  <rect width="1080" height="1920" fill="url(#kkWall)"/>
  <rect width="1080" height="1300" fill="url(#kkPrint)"/>
  <!-- window: rainy night city, an elevated metro line with a lit train passing -->
  <g clip-path="url(#kkWin)">
    <rect x="190" y="290" width="700" height="460" fill="url(#kkNight)"/>
    <path d="M190 700 V560 h50 v-70 h40 v100 h40 V470 h60 v120 h30 v-50 h50 v-90 h70 v140 h40 v-60 h50 v100 h40 V500 h60 v80 h40 v-40 h50 v-60 h40 v120 h40 V700 Z" fill="#241f5c"/>
    <g fill="#ffd36b" opacity=".75"><rect x="258" y="520" width="8" height="10"/><rect x="338" y="490" width="8" height="10"/><rect x="350" y="540" width="8" height="10"/><rect x="472" y="470" width="8" height="10"/><rect x="580" y="540" width="8" height="10"/><rect x="688" y="530" width="8" height="10"/><rect x="720" y="580" width="8" height="10"/><rect x="820" y="560" width="8" height="10"/></g>
    <path d="M190 730 H890" stroke="#4d3f8f" stroke-width="14"/>
    <g class="kkTrain" opacity=".85"><rect x="190" y="700" width="380" height="30" rx="8" fill="#9b6bff"/><g fill="#fff6c8"><rect x="210" y="707" width="30" height="13" rx="2"/><rect x="255" y="707" width="30" height="13" rx="2"/><rect x="300" y="707" width="30" height="13" rx="2"/><rect x="345" y="707" width="30" height="13" rx="2"/><rect x="390" y="707" width="30" height="13" rx="2"/><rect x="435" y="707" width="30" height="13" rx="2"/><rect x="480" y="707" width="30" height="13" rx="2"/><rect x="525" y="707" width="30" height="13" rx="2"/></g></g>
    <g class="kkRain" stroke="#c9d8ff" stroke-width="3" opacity=".55" stroke-linecap="round">
      <path d="M220 280 l-8 40 M290 330 l-8 40 M360 300 l-8 40 M430 350 l-8 40 M500 290 l-8 40 M570 340 l-8 40 M640 300 l-8 40 M710 350 l-8 40 M780 290 l-8 40 M850 330 l-8 40 M255 430 l-8 40 M395 470 l-8 40 M535 420 l-8 40 M675 460 l-8 40 M815 420 l-8 40 M325 560 l-8 40 M465 600 l-8 40 M605 560 l-8 40 M745 600 l-8 40"/>
    </g>
  </g>
  <rect x="180" y="280" width="720" height="480" rx="8" fill="none" stroke="#11b3a3" stroke-width="26"/>
  <path d="M540 280 V760" stroke="#11b3a3" stroke-width="16"/>
  <path d="M160 782 H920" stroke="#0c8f83" stroke-width="28" stroke-linecap="round"/>
  <!-- marigold curtains -->
  <path d="M100 236 H260 C250 420 270 600 230 800 H96 Z" fill="url(#kkCurt)"/>
  <path d="M980 236 H820 C830 420 810 600 850 800 H984 Z" fill="url(#kkCurt)"/>
  <path d="M80 232 H1000" stroke="#5a3a1a" stroke-width="12" stroke-linecap="round"/>
  <!-- fairy lights -->
  <path d="M110 258 Q325 340 540 258 Q755 340 970 258" stroke="#ffe8a0" stroke-width="3" fill="none" opacity=".7"/>
  <g class="kkFairy"><circle cx="160" cy="278" r="11" fill="#fff36b"/><circle cx="235" cy="303" r="11" fill="#7ff0e0"/><circle cx="320" cy="316" r="11" fill="#fff36b"/><circle cx="405" cy="306" r="11" fill="#ffffff"/><circle cx="480" cy="282" r="11" fill="#7ff0e0"/><circle cx="600" cy="282" r="11" fill="#fff36b"/><circle cx="675" cy="306" r="11" fill="#ffffff"/><circle cx="760" cy="316" r="11" fill="#7ff0e0"/><circle cx="845" cy="303" r="11" fill="#fff36b"/><circle cx="920" cy="278" r="11" fill="#ffffff"/></g>
  <!-- money plant trailing from a shelf on the left, a poster on the right -->
  <rect x="20" y="880" width="170" height="16" rx="4" fill="#ffb300"/><path d="M60 880 h70 l-8 -52 h-54z" fill="#11b3a3"/>
  <g fill="#3ddc84"><ellipse cx="80" cy="830" rx="22" ry="12"/><ellipse cx="112" cy="822" rx="20" ry="11"/><ellipse cx="70" cy="930" rx="16" ry="10"/><ellipse cx="96" cy="980" rx="16" ry="10"/><ellipse cx="72" cy="1030" rx="16" ry="10"/><ellipse cx="150" cy="940" rx="16" ry="10"/><ellipse cx="164" cy="1000" rx="16" ry="10"/></g>
  <path d="M84 896 C60 940 100 990 70 1040 M140 896 C160 940 150 980 166 1010" stroke="#22a85f" stroke-width="4" fill="none"/>
  <rect x="902" y="880" width="140" height="190" rx="8" fill="#ffd54a"/><rect x="918" y="896" width="108" height="158" rx="4" fill="#11b3a3"/><circle cx="972" cy="960" r="30" fill="#ff6fa3"/><path d="M932 1030 l30 -40 l25 25 l20 -20 l20 35z" fill="#ffd54a"/>
  <!-- desk lamp, right -->
  <circle cx="930" cy="1190" r="300" fill="url(#kkLamp)"/>
  <path d="M900 1300 l30 -120 l50 -30" stroke="#ffd54a" stroke-width="12" fill="none" stroke-linecap="round"/><path d="M960 1140 l60 -10 l-20 60 z" fill="#ffb300"/>
  <!-- desk and rug -->
  <rect x="0" y="1300" width="1080" height="620" fill="url(#kkFloor)"/>
  <g stroke="#ffb300" stroke-width="6" opacity=".35" fill="none"><path d="M0 1560 H1080 M0 1600 H1080"/></g>
  <rect x="-20" y="1286" width="1120" height="34" rx="6" fill="url(#kkDesk)"/>
  <style>
    .kkTrain{animation:kkTrain 6s linear infinite}
    @keyframes kkTrain{from{transform:translateX(-420px)}to{transform:translateX(760px)}}
    .kkRain{animation:kkRain .5s linear infinite}
    @keyframes kkRain{from{transform:translate(0,-60px)}to{transform:translate(-12px,60px)}}
    .kkFairy circle{animation:kkTw 1.6s ease-in-out infinite alternate}.kkFairy circle:nth-child(2n){animation-delay:.8s}
    @keyframes kkTw{from{opacity:.55}to{opacity:1}}
  </style>
</svg>
